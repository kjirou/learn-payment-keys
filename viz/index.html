<title>決済鍵の可視化</title>
<!--
  docs/02〜05 の鍵と操作を「値ノード」と「操作ノード」の DAG として描く。
  依存ライブラリなし。file:// で直接開ける。
  埋め込んでいる値はデモ(js/src/main.js)と同じダミー入力から計算したもので、

<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1f2328; --muted: #656d76; --line: #d0d7de;

    --data-fill: #e8f1fb; --data-stroke: #4a79b8;
    --op-fill: #eaf6e8; --op-stroke: #4e8f4a;
    --cmp-fill: #f9e9f1; --cmp-stroke: #a33c73;
    --note-fill: #fffbe6; --note-stroke: #d9c36a;
    --sel: #0969da; --secret: #c62828;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; font-size: 14px; }
  header { padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { border: 1px solid var(--line); background: #fff; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .tabs button.on { background: var(--sel); color: #fff; border-color: var(--sel); }
  .ctl { display: flex; gap: 12px; align-items: center; margin-left: auto; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .ctl label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
  .ctl button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 12.5px; }
  main { flex: 1; display: flex; min-height: 0; }
  #wrap { flex: 1; position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
  svg.drag { cursor: grabbing; }
  #hint { position: absolute; left: 12px; bottom: 10px; font-size: 11.5px; color: var(--muted); background: rgba(255,255,255,.85); padding: 3px 8px; border-radius: 6px; pointer-events: none; }
  aside { width: 400px; background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 14px 18px 30px; font-size: 13px; line-height: 1.6; }
  aside h2 { font-size: 16px; margin: 0 0 2px; }
  aside h3 { font-size: 13px; margin: 16px 0 4px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 2px; }
  aside .sub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  aside p { margin: 6px 0; }
  aside ul { margin: 4px 0; padding-left: 18px; }
  aside code, aside pre, .mono { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  aside pre { background: #f3f4f6; border-radius: 6px; padding: 8px 10px; font-size: 11.5px; white-space: pre-wrap; word-break: break-all; margin: 4px 0; }
  aside code { font-size: 11.5px; word-break: break-all; }
  aside table { border-collapse: collapse; width: 100%; font-size: 11.5px; }
  aside td { vertical-align: top; padding: 3px 4px; border-bottom: 1px solid #eceff2; }
  aside td:first-child { color: var(--muted); white-space: nowrap; width: 38%; }
  aside .badges { display: flex; gap: 5px; flex-wrap: wrap; margin: 6px 0 8px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #eef0f3; color: #444; border: 1px solid #dfe3e8; }
  .badge.key { background: var(--key-fill); border-color: var(--key-stroke); }
  .badge.data { background: var(--data-fill); border-color: var(--data-stroke); }
  .badge.op { background: var(--op-fill); border-color: var(--op-stroke); }
  .badge.cmp { background: var(--cmp-fill); border-color: var(--cmp-stroke); }
  .badge.secret { background: #fdecea; color: var(--secret); border-color: #f2b8b5; }
  .badge.random { background: #f1eafc; border-color: #c9b4ee; }
  .badge.external { background: #e6f4f1; border-color: #9fd3c7; }
  .badge.state { background: #fff0e0; border-color: #f0c08a; }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12px; align-items: center; }
  .legend svg { width: 44px; height: 22px; cursor: default; }
  aside a { color: var(--sel); }
  .doc { font-size: 12px; margin-top: 12px; }

  /* SVG */
  .frame rect { fill: rgba(120, 130, 150, .06); stroke: #b6bcc6; stroke-dasharray: 5 4; stroke-width: 1; }
  .frame text { font-size: 11px; font-weight: 700; fill: #6b7380; }
  .edge { fill: none; stroke: #6b7380; stroke-width: 1.6; }
  .edge.protect { stroke: var(--key-stroke); stroke-dasharray: 7 5; }
  .edge.noteline { stroke: #c4b56a; stroke-dasharray: 2 4; stroke-width: 1.2; }
  .edge.hl { stroke: var(--sel); stroke-width: 2.6; }
  .edge.dim { opacity: .28; }
  .node { cursor: pointer; }
  .node .body { stroke-width: 1.4; }
  .node.key .body { fill: var(--key-fill); stroke: var(--key-stroke); }
  .node.data .body { fill: var(--data-fill); stroke: var(--data-stroke); }
  .node.op .body { fill: var(--op-fill); stroke: var(--op-stroke); }
  .node.cmp .body { fill: var(--cmp-fill); stroke: var(--cmp-stroke); }
  .node.note .body { fill: var(--note-fill); stroke: var(--note-stroke); stroke-dasharray: 3 3; }
  .node .stack { fill: #fff; stroke: var(--key-stroke); stroke-width: 1; opacity: .7; }
  .node.sel .body { stroke: var(--sel); stroke-width: 3; }
  .node.nb .body { stroke-width: 2.4; }
  .node.dim { opacity: .45; }
  .node text { pointer-events: none; }
  .node .label { font-size: 12.5px; font-weight: 700; fill: var(--ink); }
  .node .subt { font-size: 10px; fill: var(--muted); }
  .node .val { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #24292f; }
  .node .val.secret { fill: var(--secret); }
  .node.cmp .val { font-family: inherit; font-weight: 700; fill: var(--cmp-stroke); }
  .node .ntext { font-size: 10.5px; fill: #5c4d12; }
  .bdg rect { rx: 7; ry: 7; fill: #eef0f3; stroke: #d5dae0; stroke-width: .8; }
  .bdg text { font-size: 9px; fill: #444; }
  .bdg.secret rect { fill: #fdecea; stroke: #f2b8b5; } .bdg.secret text { fill: var(--secret); }
  .bdg.random rect { fill: #f1eafc; stroke: #c9b4ee; }
  .bdg.external rect { fill: #e6f4f1; stroke: #9fd3c7; }
  .bdg.state rect { fill: #fff0e0; stroke: #f0c08a; }
  .bdg.hsm rect { fill: #ebe7f7; stroke: #b9aee0; }
  .bdg.card rect { fill: #fdeedd; stroke: #ecc49a; }
  .bdg.term rect { fill: #e1f2f4; stroke: #9fcfd6; }
</style>

<script>

const V = {

    txParts: [
      ["9F02", "Amount, Authorised", "000000010000"], ["9F03", "Amount, Other", "000000000000"], ["9F1A", "Terminal Country Code", "0392"],
      ["95", "TVR", "0000000000"], ["5F2A", "Transaction Currency Code", "0392"], ["9A", "Transaction Date", "261027"],
      ["9C", "Transaction Type", "00"], ["9F37", "Unpredictable Number", "12345678"], ["82", "AIP", "3800"],

      dec: "7518136303021512", CVV: "751" },

const DOCS = {
  "01": "docs/01-crypto-basics.md", "02": "docs/02-key-exchange.md", "03": "docs/03-pin-keys.md",
  "04": "docs/04-emv-keys.md", "05": "docs/05-cvv.md",
};

// ノード生成の小道具。c, r はグリッド座標(列, 行)。
const key  = (id, label, o) => Object.assign({ id, kind: "key",  label }, o);
const data = (id, label, o) => Object.assign({ id, kind: "data", label }, o);
const op   = (id, label, o) => Object.assign({ id, kind: "op",   label }, o);
const cmp  = (id, label, o) => Object.assign({ id, kind: "cmp",  label }, o);
const note = (id, c, r, text, target) => ({ id, kind: "note", c, r, text, target });
const e    = (from, to, o) => Object.assign({ from, to, kind: "flow" }, o);
const prot = (from, to) => ({ from, to, kind: "protect" });
const RANDOM = { k: "random", t: "乱数生成" };
const CALC = { k: "derived", t: "計算で得る" };
const ext = (t) => ({ k: "external", t });
const state = (t) => ({ k: "state", t });

// ---------------------------------------------------------------------------
// 02 鍵交換
// ---------------------------------------------------------------------------
const K = V.k02;
const TAB02 = {
  id: "02", title: "02 鍵交換", doc: "02",
  intro: "ZMK を人手(鍵コンポーネント)で共有し、以後の作業鍵は ZMK で暗号化してオンラインで運ぶ。ここでは作業鍵の例として ZPK を使っているが、PVK や CVK など他の作業鍵も同じ仕組みで運ぶ。実線は計算の流れ、破線は保護関係(上の鍵で暗号化して保管・運搬する関係)で、00 の階層図 [A] の親子線に当たる。",
  frames: [
    { label: "送り側の HSM", c0: 0, c1: 2, r0: 0, r1: 5 },
    { label: "輸送(人手 / ネットワーク)", c0: 3, c1: 3, r0: 0, r1: 5 },
    { label: "受け側の HSM", c0: 4, c1: 7, r0: 0, r1: 5 },
  ],
  nodes: [
    key("lmk", "LMK", { sub: "Local Master Key", c: 0, r: 0, where: "送り側 HSM 内", origin: RANDOM, value: null, vnote: "値は HSM の外に出ない(本リポジトリでは扱わない)",
      doc: { f: "02", s: "登場する鍵" },
      desc: "HSM 内部に格納される最上位の鍵。HSM に保管する他のすべての鍵は LMK で暗号化された形で DB などに保存される。計算の木には現れず、保護関係(破線)の根としてだけ登場する。",
      extra: ["Thales payShield の呼び名。Utimaco Atalla では MFK。"] }),
    key("zmk", "ZMK", { sub: "Zone Master Key / ZCMK / KEK", c: 1, r: 1, where: "送り側 HSM 内", origin: RANDOM, value: K.ZMK, steps: [["KCV", K.ZMK_KCV]],
      doc: { f: "02", s: "登場する鍵" },
      desc: "2 組織の間(ゾーン)で共有するマスター鍵。作業鍵をこの鍵で暗号化して相手に渡す。最上位なので上位の鍵で暗号化して運べず、コンポーネントに分けて人手で渡す。",
      protect: ["LMK で暗号化して保管(ZMK under LMK)"], extra: ["Visa では ZCMK、一般名は KEK (Key Encryption Key)。"] }),
    key("c1", "C1(コンポーネント 1)", { sub: "管理者 1 が封緘して輸送", c: 0, r: 2, where: "送り側 HSM → 人手", origin: RANDOM, value: K.C1, steps: [["KCV", K.C1_KCV]],
      doc: { f: "02", s: "3 人の管理者に分割する手順" },
      desc: "ZMK とは無関係な乱数。単独では ZMK の情報を一切持たない(ワンタイムパッドと同じ原理)。" }),
    key("c2", "C2(コンポーネント 2)", { sub: "管理者 2 が封緘して輸送", c: 0, r: 3, where: "送り側 HSM → 人手", origin: RANDOM, value: K.C2, steps: [["KCV", K.C2_KCV]],
      doc: { f: "02", s: "3 人の管理者に分割する手順" },
      desc: "C1 と同じく ZMK とは無関係な乱数。" }),
    op("opSplit", "XOR で分割", { c: 2, r: 2, where: "送り側 HSM 内", formula: ["C3 = ZMK ⊕ C1 ⊕ C2"],
      steps: [["ZMK", K.ZMK], ["C1", K.C1], ["C2", K.C2], ["C1 ⊕ C2", K.C1xC2], ["C3 = (C1 ⊕ C2) ⊕ ZMK", K.C3]],
      doc: { f: "02", s: "3 人の管理者に分割する手順" },
      desc: "C1、C2 を乱数で作り、C3 を計算で求める。3 つとも見た目は乱数で、2 つ集めても残り 1 つが分からない限り ZMK は 2^128 通りのどれでもあり得る。",
      extra: ["奇数パリティのコンポーネント同士を XOR すると偶数パリティになるため、HSM は合成後にパリティを再調整する(暗号結果には影響しない)。"] }),
    key("c3", "C3(コンポーネント 3)", { sub: "管理者 3 が封緘して輸送", c: 3, r: 2, where: "人手", origin: CALC, value: K.C3, steps: [["KCV", K.C3_KCV]],
      doc: { f: "02", s: "3 人の管理者に分割する手順" },
      desc: "ZMK を 2 つの乱数で覆い隠した値。これも見た目は乱数で、単独では ZMK の情報を持たない。" }),
    op("opKcvZmk", "KCV 計算", { c: 2, r: 0, where: "送り側 HSM 内", formula: ["KCV = 3DES_ZMK( 00 00 00 00 00 00 00 00 ) の先頭 3 バイト"],

      doc: { f: "02", s: "KCV (Key Check Value)" },

    data("kcvZmk", "ZMK の KCV", { sub: "送り側が相手に伝える", c: 3, r: 0, where: "人手", origin: CALC, value: K.ZMK_KCV,

    op("opRestore", "XOR で復元", { c: 4, r: 2, where: "受け側 HSM 内", formula: ["ZMK = C1 ⊕ C2 ⊕ C3"],

    key("zmkR", "ZMK(復元)", { sub: "送り側と同じ値に戻る", c: 5, r: 2, where: "受け側 HSM 内", origin: CALC, value: K.restored, steps: [["KCV", K.ZMK_KCV]],

    cmp("cmpKcv", "KCV 照合", { sub: "伝えられた KCV と再計算した KCV", c: 6, r: 1, where: "受け側 HSM", result: "一致",

      doc: { f: "02", s: "KCV (Key Check Value)" },
      desc: "一致すれば鍵交換は完了。合わなければ入力ミスや取り違えなので最初からやり直す。鍵の値そのものは比較しない(見せない)のが要点。" }),
    key("zpkA", "ZPK_A", { sub: "Zone PIN Key(作業鍵)", c: 1, r: 4, where: "送り側 HSM 内", origin: RANDOM, value: K.ZPK_A, steps: [["KCV", K.ZPK_A_KCV]],

const panel = document.getElementById("panel");
let cur = 0, selected = null;
const opt = { notes: true, frames: true, protect: true };
let vb = { x: 0, y: 0, w: 1000, h: 600 };

function el(tag, attrs, text) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs || {}) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tw = (s) => [...String(s)].reduce((w, ch) => w + (ch.charCodeAt(0) > 255 ? 9 : 5.4), 0);

function box(n) {
  if (n.kind === "note") {
    const lines = n.text.split("\n").length;
    return { x: M + n.c * COLW, y: M + n.r * ROWH, w: NOTE_W, h: 12 + lines * 15 };
  }
  return { x: M + n.c * COLW, y: M + n.r * ROWH, w: NW, h: NH };
}
const cy = (b) => b.y + b.h / 2;

function edgePath(a, b, o) {
  o = o || {};
  if (o.route === "v") {
    // 出発ノードの下から真下に降り、目的ノードの行で右へ曲がる
    const sx = a.x + a.w / 2, sy = a.y + a.h, tx = b.x, ty = cy(b);
    return `M${sx},${sy} L${sx},${ty - 22} Q${sx},${ty} ${sx + 22},${ty} L${tx},${ty}`;
  }
  if (b.x >= a.x + a.w) {
    // 前方: 出発行(または指定レーン)に沿って進み、最後の列間で曲がる
    const sx = a.x + a.w, sy = cy(a), tx = b.x, ty = cy(b);
    const yl = o.lane != null ? M + o.lane * ROWH + NH / 2 : sy;
    const x1 = sx + GAP, x2 = tx - GAP;
    if (x2 <= x1 + 4) return `M${sx},${sy} C${(sx + tx) / 2},${sy} ${(sx + tx) / 2},${ty} ${tx},${ty}`;
    return `M${sx},${sy} C${sx + GAP / 2},${sy} ${sx + GAP / 2},${yl} ${x1},${yl} L${x2},${yl} C${tx - GAP / 2},${yl} ${tx - GAP / 2},${ty} ${tx},${ty}`;
  }
  if (b.x + b.w <= a.x) {
    const sx = a.x, sy = cy(a), tx = b.x + b.w, ty = cy(b), d = Math.max(50, (sx - tx) / 2);
    return `M${sx},${sy} C${sx - d},${sy} ${tx + d},${ty} ${tx},${ty}`;
  }
  // 同じ列: 上下につなぐ
  if (b.y > a.y) {
    const sx = a.x + a.w / 2, sy = a.y + a.h, tx = b.x + b.w / 2, ty = b.y, d = (ty - sy) / 2;
    return `M${sx},${sy} C${sx},${sy + d} ${tx},${ty - d} ${tx},${ty}`;
  }
  const sx = a.x + a.w / 2, sy = a.y, tx = b.x + b.w / 2, ty = b.y + b.h, d = (sy - ty) / 2;
  return `M${sx},${sy} C${sx},${sy - d} ${tx},${ty + d} ${tx},${ty}`;
}

function whereClass(w) {
  if (!w) return "";
  if (/HSM|イシュア/.test(w) && !/カード/.test(w)) return "hsm";
  if (/カード|チップ/.test(w)) return "card";
  if (/端末/.test(w)) return "term";
  return "";
}

function badge(g, x, y, text, cls) {
  const w = tw(text) + 10;
  const b = el("g", { class: "bdg " + (cls || ""), transform: `translate(${x},${y})` });
  b.append(el("rect", { x: 0, y: 0, width: w, height: 14 }));
  b.append(el("text", { x: 5, y: 10 }, text));
  g.append(b);
  return w;
}

function drawNode(n, b, nb) {
  const cls = ["node", n.kind, selected === n.id ? "sel" : "", nb.has(n.id) ? "nb" : "", selected && selected !== n.id && !nb.has(n.id) ? "dim" : ""].join(" ");
  const g = el("g", { class: cls, "data-id": n.id, transform: `translate(${b.x},${b.y})` });
  if (n.kind === "note") {
    g.append(el("rect", { class: "body", x: 0, y: 0, width: b.w, height: b.h, rx: 5 }));
    const t = el("text", { class: "ntext", x: 8, y: 16 });
    n.text.split("\n").forEach((line, i) => t.append(el("tspan", { x: 8, dy: i ? 15 : 0 }, line)));
    g.append(t);
    return g;
  }
  if (n.many) {
    g.append(el("rect", { class: "stack", x: 10, y: 10, width: b.w, height: b.h, rx: 8 }));
    g.append(el("rect", { class: "stack", x: 5, y: 5, width: b.w, height: b.h, rx: 8 }));
  }
  g.append(el("rect", { class: "body", x: 0, y: 0, width: b.w, height: b.h, rx: 8 }));
  const prefix = n.kind === "op" ? "ƒ " : n.kind === "cmp" ? "≟ " : "";
  g.append(el("text", { class: "label", x: 9, y: 17 }, prefix + n.label));
  if (n.sub) g.append(el("text", { class: "subt", x: 9, y: 30 }, n.sub));
  let v;
  if (n.kind === "cmp") v = "→ " + (n.result || "");
  else if (n.kind === "op") v = n.formula ? n.formula[0] : "";
  else v = n.value == null ? "(値なし)" : n.value;
  const vt = el("text", { class: "val" + (n.secret ? " secret" : ""), x: 9, y: 45 }, v.length > 36 ? v.slice(0, 34) + "…" : v);
  g.append(vt);
  let x = 8;
  if (n.where) x += badge(g, x, b.h - 19, n.where.length > 18 ? n.where.slice(0, 17) + "…" : n.where, whereClass(n.where)) + 4;
  if (n.origin && n.origin.k !== "derived" && n.kind !== "op") x += badge(g, x, b.h - 19, n.origin.t.length > 12 ? n.origin.t.slice(0, 11) + "…" : n.origin.t, n.origin.k) + 4;
  if (n.secret) x += badge(g, x, b.h - 19, "平文", "secret") + 4;
  return g;
}

function render() {
  const tab = TABS[cur];
  svg.innerHTML = "";
  const defs = el("defs");
  for (const [id, color] of [["arrow", "#6b7380"], ["arrowhl", "#0969da"], ["arrowp", "#c99a2e"]]) {
    const m = el("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
    m.append(el("path", { d: "M0,0 L10,5 L0,10 z", fill: color }));
    defs.append(m);
  }
  svg.append(defs);
  const byId = {}, pos = {};
  for (const n of tab.nodes) { byId[n.id] = n; pos[n.id] = box(n); }
  const visible = (n) => n.kind !== "note" || opt.notes;

  const gFrames = el("g"), gEdges = el("g"), gNodes = el("g");
  if (opt.frames) for (const f of tab.frames) {
    const x = M + f.c0 * COLW - 12, y = M + f.r0 * ROWH - 20, w = (f.c1 - f.c0) * COLW + NW + 24, h = (f.r1 - f.r0) * ROWH + NH + 26;
    const g = el("g", { class: "frame" });
    g.append(el("rect", { x, y, width: w, height: h, rx: 10 }));
    g.append(el("text", { x: x + 10, y: y + 13 }, f.label));
    gFrames.append(g);
  }
  const nb = new Set();
  if (selected) for (const ed of tab.edges) { if (ed.from === selected) nb.add(ed.to); if (ed.to === selected) nb.add(ed.from); }
  for (const ed of tab.edges) {
    if (ed.kind === "protect" && !opt.protect) continue;
    const hl = selected && (ed.from === selected || ed.to === selected);
    const dim = selected && !hl;
    const p = el("path", { class: ["edge", ed.kind === "protect" ? "protect" : "", hl ? "hl" : "", dim ? "dim" : ""].join(" "), d: edgePath(pos[ed.from], pos[ed.to], ed),
      "marker-end": `url(#${hl ? "arrowhl" : ed.kind === "protect" ? "arrowp" : "arrow"})` });
    gEdges.append(p);
  }
  if (opt.notes) for (const n of tab.nodes) if (n.kind === "note" && n.target && pos[n.target]) {
    const a = pos[n.id], b = pos[n.target];
    gEdges.append(el("path", { class: "edge noteline", d: `M${a.x + a.w / 2},${a.y + a.h / 2} L${b.x + b.w / 2},${b.y + b.h / 2}` }));
  }
  for (const n of tab.nodes) if (visible(n)) {
    if (n.kind !== "note") continue; gNodes.append(drawNode(n, pos[n.id], nb));
  }
  for (const n of tab.nodes) if (n.kind !== "note") gNodes.append(drawNode(n, pos[n.id], nb));
  svg.append(gFrames, gEdges, gNodes);
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
}

function contentBox() {
  const tab = TABS[cur];
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y, w, h) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); };
  for (const n of tab.nodes) { if (n.kind === "note" && !opt.notes) continue; const b = box(n); add(b.x, b.y, b.w + (n.many ? 10 : 0), b.h + (n.many ? 10 : 0)); }
  if (opt.frames) for (const f of tab.frames) add(M + f.c0 * COLW - 12, M + f.r0 * ROWH - 20, (f.c1 - f.c0) * COLW + NW + 24, (f.r1 - f.r0) * ROWH + NH + 26);
  return { x: x0 - 24, y: y0 - 24, w: x1 - x0 + 48, h: y1 - y0 + 48 };
}

function fit() {
  const c = contentBox();
  const W = svg.clientWidth || 1000, H = svg.clientHeight || 600;
  const s = Math.max(c.w / W, c.h / H);
  vb = { x: c.x - (W * s - c.w) / 2, y: c.y - (H * s - c.h) / 2, w: W * s, h: H * s };
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
}
function zoomAt(factor, px, py) {
  const r = svg.getBoundingClientRect();
  const mx = vb.x + ((px - r.left) / r.width) * vb.w, my = vb.y + ((py - r.top) / r.height) * vb.h;
  vb = { x: mx - (mx - vb.x) * factor, y: my - (my - vb.y) * factor, w: vb.w * factor, h: vb.h * factor };
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
}

// ---------------------------------------------------------------------------
// 右パネル
// ---------------------------------------------------------------------------
const KIND_JA = { key: "鍵(値)", data: "データ(値)", op: "操作(計算)", cmp: "操作(比較)", note: "注釈" };
function legendHtml() {
  const sw = (fill, stroke, dash) => `<svg viewBox="0 0 44 22"><rect x="2" y="3" width="40" height="16" rx="5" fill="${fill}" stroke="${stroke}" ${dash ? 'stroke-dasharray="3 3"' : ""}/></svg>`;
  const ln = (stroke, dash) => `<svg viewBox="0 0 44 22"><path d="M2,11 L42,11" stroke="${stroke}" stroke-width="2" fill="none" ${dash ? `stroke-dasharray="${dash}"` : ""}/></svg>`;
  return `<div class="legend">
    ${sw("#fff4d6", "#c99a2e")}<span>鍵(値)。乱数生成か、計算で派生</span>
    ${sw("#e8f1fb", "#4a79b8")}<span>データ(値)。入力、途中結果、受け取った値</span>
    ${sw("#eaf6e8", "#4e8f4a")}<span>ƒ 操作(計算)。クリックで式と途中値</span>
    ${sw("#f9e9f1", "#a33c73")}<span>≟ 操作(比較)。2 つの値を突き合わせて一致 / 不一致</span>
    ${sw("#fffbe6", "#d9c36a", true)}<span>注釈。状態・順序、1 対多、往復などの補足</span>
    ${ln("#6b7380")}<span>計算の流れ(入力 → 操作 → 出力)</span>
    ${ln("#c99a2e", "7 5")}<span>保護関係(上の鍵で暗号化して保管・運搬)</span>
    ${ln("#c4b56a", "2 4")}<span>注釈の対象</span>
    <span class="badge random">乱数生成</span><span>何からも計算されない根</span>
    <span class="badge external">受信 / 読取</span><span>外部から来た値(比較の相手など)</span>
    <span class="badge state">状態</span><span>カードが保持し更新する値(ATC)</span>
    <span class="badge secret">平文</span><span>PIN パッドや HSM の外に出ない値</span>
  </div>`;
}
function defaultPanel() {
  const tab = TABS[cur];
  panel.innerHTML = `<h2>${esc(tab.title)}</h2><div class="sub">${esc(DOCS[tab.doc])}</div><p>${esc(tab.intro)}</p>
    <h3>読み方</h3><p>左から右へ計算が進む。ノードをクリックすると、その値、式、途中の値、文書の該当節をここに表示する。選んだノードにつながる辺は青く強調される。</p>
    <h3>凡例</h3>${legendHtml()}`;
}
function showNode(n) {
  const tab = TABS[cur];
  let h = `<h2>${esc(n.label)}</h2>`;
  if (n.sub) h += `<div class="sub">${esc(n.sub)}</div>`;
  h += `<div class="badges"><span class="badge ${n.kind}">${KIND_JA[n.kind]}</span>`;
  if (n.where) h += `<span class="badge">${esc(n.where)}</span>`;
  if (n.origin) h += `<span class="badge ${n.origin.k}">${esc(n.origin.t)}</span>`;
  if (n.secret) h += `<span class="badge secret">平文。外に出ない</span>`;
  if (n.many) h += `<span class="badge">1 対多</span>`;
  h += `</div>`;
  if (n.kind === "note") { h += `<p>${esc(n.text).replace(/\n/g, " ")}</p>`; panel.innerHTML = h; return; }
  if (n.desc) h += `<p>${esc(n.desc)}</p>`;
  if (n.kind === "key" || n.kind === "data") {
    h += `<h3>値</h3>`;
    h += n.value == null ? `<p>${esc(n.vnote || "値なし")}</p>` : `<pre>${esc(n.value)}</pre>`;
  }
  if (n.kind === "cmp") h += `<h3>結果</h3><p><b>${esc(n.result)}</b></p>`;
  if (n.formula) h += `<h3>式</h3><pre>${esc(n.formula.join("\n"))}</pre>`;
  if (n.steps && n.steps.length) {
    h += `<h3>${n.kind === "cmp" ? "比較した値" : n.kind === "op" ? "途中の値" : "関連する値"}</h3><table>`;
    for (const [k, v] of n.steps) h += `<tr><td>${esc(k)}</td><td><code>${esc(v)}</code></td></tr>`;
    h += `</table>`;
  }
  const ins = tab.edges.filter((d) => d.kind === "flow" && d.to === n.id).map((d) => d.from);
  const outs = tab.edges.filter((d) => d.kind === "flow" && d.from === n.id).map((d) => d.to);
  const name = (id) => { const m = tab.nodes.find((x) => x.id === id); return m ? esc(m.label) : id; };
  if (ins.length || outs.length) {
    h += `<h3>つながり</h3><ul>`;
    if (ins.length) h += `<li>入力: ${ins.map(name).join("、")}</li>`;
    if (outs.length) h += `<li>出力先: ${outs.map(name).join("、")}</li>`;
    h += `</ul>`;
  }
  if (n.protect && n.protect.length) h += `<h3>保護関係</h3><ul>${n.protect.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>`;
  if (n.extra && n.extra.length) h += `<h3>補足</h3><ul>${n.extra.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>`;
  if (n.doc) h += `<div class="doc">参照: <a href="../${DOCS[n.doc.f]}" target="_blank">${esc(DOCS[n.doc.f])}</a> › ${esc(n.doc.s)}</div>`;
  panel.innerHTML = h;
}
function select(id) {
  selected = id;
  render();
  const n = TABS[cur].nodes.find((x) => x.id === id);
  if (n) showNode(n); else defaultPanel();
}

// ---------------------------------------------------------------------------
// 操作
// ---------------------------------------------------------------------------
const tabsEl = document.getElementById("tabs");
TABS.forEach((t, i) => {
  const b = document.createElement("button");
  b.textContent = t.title;
  b.onclick = () => switchTab(i);
  tabsEl.append(b);
});
function switchTab(i) {
  cur = i; selected = null;
  [...tabsEl.children].forEach((b, j) => b.classList.toggle("on", j === i));
  render(); fit(); defaultPanel();
  history.replaceState(null, "", "#" + TABS[i].id);
}
document.getElementById("tNotes").onchange = (ev) => { opt.notes = ev.target.checked; render(); };
document.getElementById("tFrames").onchange = (ev) => { opt.frames = ev.target.checked; render(); };
document.getElementById("tProtect").onchange = (ev) => { opt.protect = ev.target.checked; render(); };
document.getElementById("fit").onclick = fit;
document.getElementById("zoomIn").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(0.8, r.left + r.width / 2, r.top + r.height / 2); };
document.getElementById("zoomOut").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1.25, r.left + r.width / 2, r.top + r.height / 2); };

let drag = null;
svg.addEventListener("mousedown", (ev) => { drag = { x: ev.clientX, y: ev.clientY, vx: vb.x, vy: vb.y, moved: false }; });
window.addEventListener("mousemove", (ev) => {
  if (!drag) return;
  const r = svg.getBoundingClientRect(), s = vb.w / r.width;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; svg.classList.add("drag"); }
  vb.x = drag.vx - dx * s; vb.y = drag.vy - dy * s;
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
});
window.addEventListener("mouseup", (ev) => {
  if (!drag) return;
  const moved = drag.moved; drag = null; svg.classList.remove("drag");
  if (moved) return;
  const g = ev.target.closest && ev.target.closest(".node");
  select(g ? g.getAttribute("data-id") : null);
});
svg.addEventListener("wheel", (ev) => { ev.preventDefault(); zoomAt(Math.exp(ev.deltaY * 0.0015), ev.clientX, ev.clientY); }, { passive: false });
window.addEventListener("resize", fit);

const initial = Math.max(0, TABS.findIndex((t) => "#" + t.id === location.hash));
switchTab(initial);
</script>
</body>
</html>
