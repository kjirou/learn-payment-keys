# viz/ 配下だけを GitHub Pages に配信する。
# ブランチ全体を配信する旧方式(Deploy from a branch)ではなく、
# 指定ディレクトリをアーティファクトとしてアップロードする方式。Jekyll は関与しない。
name: Deploy viz to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "viz/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages サイト自体の作成は GITHUB_TOKEN の権限ではできない(管理者権限が必要)ため、
      # 初回だけ手動で有効化しておく:
      #   Settings → Pages → Build and deployment → Source を "GitHub Actions" にする
      #   または gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viz
      - id: deployment
        uses: actions/deploy-pages@v4
